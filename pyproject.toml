[project]
name = "my-mimic"
version = "0.6.0"
description = "Cache/Memoization package"
authors = [
    { name = "Marco Sievers de Almeida Ximit Gaia", email = "im.ximit@gmail.com" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "meeseeks-singleton>=0.4.2",
]

[project.optional-dependencies]
redis_edition = ["redis>=5.0.8"]
temp_edition = ["aiofile>=3.8.8"]

[project.urls]
homepage = "https://github.com/CenturyBoys/my-mimic"
repository = "https://github.com/CenturyBoys/my-mimic"
documentation = "https://github.com/CenturyBoys/my-mimic"

[dependency-groups]
dev = [
    "pytest-cov>=4.0.0",
    "mutatest>=3.1.0",
    "freezegun>=1.2.2",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=3.4.0",
    "ruff>=0.11.5",
    "mypy>=1.11.0",
    "redis>=5.0.8",
    "aiofile>=3.8.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mr"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["mr"]
pretty = true

[[tool.mypy.overrides]]
module = ["meeseeks.*", "aiofile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.report]
exclude_lines = [
    "@dataclass(slots=True, frozen=True)",
]
omit = [
    "*/interface*",
    "*states/__init__.py",
]
