name: Publish

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Resolve version
        id: version
        run: echo "value=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Check if version is already on PyPI
        id: published
        # Publishing runs on every push to main (same rule as the reference repos),
        # so skip when the current version already exists — bump the version in
        # pyproject.toml to release. This keeps unchanged merges a clean no-op.
        run: |
          if curl -sfI "https://pypi.org/pypi/my-mimic/${{ steps.version.outputs.value }}/json" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::my-mimic ${{ steps.version.outputs.value }} already on PyPI, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distributions
        if: steps.published.outputs.exists == 'false'
        run: uv build
      - name: Publish to PyPI
        if: steps.published.outputs.exists == 'false'
        # Uses Trusted Publishing when configured on PyPI; otherwise the
        # UV_PUBLISH_TOKEN secret is picked up.
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
